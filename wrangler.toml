name = "muncie-radon"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# NOTE: account_id cannot go here. Pages rejects the field outright:
#   "Configuration file for Pages projects does not support account_id"
# This repo deploys to a different Cloudflare account than the personal one
# holding the older projects, so the wrong-account guard lives in
# scripts/check-account.mjs and runs on `npm run deploy` instead.

# D1 is the receipts database. Every lead and every call lands here, and it is
# what turns "the site ranks" into "here are 47 inbound leads with timestamps"
# when it is time to pitch a renter.
#
# Create it once, then paste the returned id below:
#   wrangler d1 create muncie-radon
#   wrangler d1 execute muncie-radon --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "muncie-radon"
database_id = "9e353747-a72f-426d-b019-fca286c01c2b"

[vars]
BRAND = "Muncie Radon"

# Pages supports exactly two named environments, "production" and "preview".
# Everything above is production. Bindings are NOT inherited by named
# environments, so preview needs its own copy: without this block a preview
# deployment has no DB binding at all and every form submit 500s, which is the
# kind of thing you discover from a real lead rather than a test.
#
# Preview points at the same database on purpose. A separate preview DB keeps
# test rows out of the receipts, but it is a second thing to create and keep
# schema'd, and an empty binding is a worse failure than a few test rows. To
# split them later: create muncie-radon-preview, apply schema.sql to it, and
# change the id below.
[env.preview]
[env.preview.vars]
BRAND = "Muncie Radon"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "muncie-radon"
database_id = "9e353747-a72f-426d-b019-fca286c01c2b"

# Secrets are NOT set here. Set them in the Pages dashboard, or:
#   wrangler pages secret put RESEND_API_KEY
#   wrangler pages secret put TWILIO_AUTH_TOKEN
#
#   RESEND_API_KEY      Resend key for the new-lead notification email
#   NOTIFY_TO           where new-lead emails go
#   NOTIFY_FROM         verified Resend sender, e.g. leads@muncieradon.com
#   FORWARD_TO          E.164 number the tracking line rings through to
#   TWILIO_AUTH_TOKEN   verifies the Twilio webhook signature
